# 一時的な確認用: GitHub のサーバー(米国)から資源エネルギー庁のファイルを取得できるかを試す。確認後に削除する。
name: probe-gas-fetch
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: fetch gas (forced)
        run: python gas.py --force && echo "probe=ok" || echo "probe=failed exit=$?"
